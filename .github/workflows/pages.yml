name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Verificación mínima para Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Compilar y probar WASM
        run: |
          npm ci
          go vet ./internal/... ./cmd/wasm
          ./scripts/build-pages.sh
          ./scripts/check-pages.sh
          node scripts/wasm-smoke.mjs

  deploy:
    name: Desplegar en GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir artefacto estático
        run: |
          ./scripts/build-pages.sh
          ./scripts/check-pages.sh

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
