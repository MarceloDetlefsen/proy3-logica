services:
  evaluador:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADDR: ":8080"
    # El binario y la imagen quedan inmutables; solo /tmp acepta escrituras
    # efímeras para los archivos intermedios de pdflatex.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    # Defensa en profundidad: ni siquiera un proceso comprometido puede ganar
    # privilegios o crear una cantidad ilimitada de procesos.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/proy3-logica", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
