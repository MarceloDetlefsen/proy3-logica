<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img" aria-label="Ilustración conceptual del cálculo lambda y la reducción beta">
  <defs>
    <linearGradient id="lambda-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13203d"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1d183b"/>
    </linearGradient>
    <radialGradient id="lambda-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="450" fill="url(#lambda-bg)"/>
  <rect width="360" height="450" fill="url(#lambda-glow)"/>
  <g stroke="#93c5fd" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="90" x2="360" y2="90"/>
    <line x1="0" y1="180" x2="360" y2="180"/>
    <line x1="0" y1="270" x2="360" y2="270"/>
    <line x1="0" y1="360" x2="360" y2="360"/>
    <line x1="90" y1="0" x2="90" y2="450"/>
    <line x1="180" y1="0" x2="180" y2="450"/>
    <line x1="270" y1="0" x2="270" y2="450"/>
  </g>
  <circle cx="180" cy="175" r="88" fill="none" stroke="#93c5fd" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="180" cy="175" r="64" fill="rgba(15, 23, 42, 0.55)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.8"/>
  <text x="180" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#bfdbfe">λ</text>
  <rect x="34" y="294" width="292" height="108" rx="12" fill="rgba(15, 23, 42, 0.72)" stroke="#60a5fa" stroke-opacity="0.34" stroke-width="1.2"/>
  <text x="180" y="324" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#e2e8f0">(λx. M) N  →β  M[x := N]</text>
  <text x="180" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93c5fd">Abstracción · Aplicación · Reducción</text>
  <text x="180" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Alonzo Church (1936)</text>
</svg>
